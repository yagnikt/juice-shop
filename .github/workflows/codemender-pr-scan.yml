name: CodeMender Security Scan (PR Trigger)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write  # Required for Workload Identity Federation OIDC token
  contents: read

jobs:
  codemender-scan:
    name: CodeMender Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          service_account: '${{ vars.GCP_WIF_SERVICE_ACCOUNT }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Execute CodeMender PR Scan Job
        run: |
          echo "Triggering CodeMender scan on Cloud Run for PR #${{ github.event.pull_request.number }}..."
          gcloud run jobs execute codemender-pr-runner \
            --region=${{ vars.GCP_REGION || 'us-central1' }} \
            --update-env-vars="CODEMENDER_RUN_MODE=pr_scan,CODEMENDER_PR_DIFF_SCOPED=true,PR_NUMBER=${{ github.event.pull_request.number }},PR_HEAD_SHA=${{ github.event.pull_request.head.sha }},PR_BASE_BRANCH=${{ github.event.pull_request.base.ref }},GITHUB_REPO_URL=${{ github.event.repository.clone_url }}" \
            --wait
